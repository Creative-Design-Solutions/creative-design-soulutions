<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bridgeworld directory demo | Find a dentist or specialist near you</title>
<meta name="description" content="Demo of the Bridgeworld directory: find a dentist or specialist near you, meet the team, see live availability and book as a new patient.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCE7CF">
<link rel="icon" type="image/png" href="../brand/icon-192.png">
<link rel="apple-touch-icon" href="../brand/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F3; --sky:#F6EEE2; --sky-2:#EFE2CF;
  /* Same sunrise as the Bridge page: dawn glow at the top, cream below. */
  --dawn:radial-gradient(ellipse 60% 420px at 88% 0, rgba(255,186,84,.42), transparent 70%), linear-gradient(180deg,#FCE7CF 0,#FBF1E4 420px,#FBF8F3 760px); --warm:#FFF6E5; --blush:#FFEDE6;
  --ink:#15303F; --ink-soft:#4F6475; --green:#1E8C72; --green-dk:#16705B; --sun:#FFC23D; --line:#E2E9EE;
  --shadow:0 10px 30px rgba(21,48,63,.08);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0; background:var(--dawn) no-repeat, var(--bg); color:var(--ink); font:1rem/1.55 var(--body); -webkit-font-smoothing:antialiased}
a{color:var(--green-dk)}
main:focus{outline:none}
:focus-visible{outline:3px solid var(--sun); outline-offset:2px; border-radius:6px}
.wrap{width:min(1140px,100% - 2rem); margin-inline:auto}
h1,h2,h3{font-family:var(--display); letter-spacing:-.015em; line-height:1.12; margin:0}
h1,h2{font-family:var(--serif); font-weight:500; letter-spacing:-.015em}
button{font:inherit; cursor:pointer}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

.demo-note{background:#F3DDB0; color:var(--ink); font-size:.9rem; text-align:center; padding:.45rem 1rem; font-weight:700}
.demo-note a{color:var(--ink)}
header.top{background:transparent}
.top .wrap{display:flex; justify-content:space-between; align-items:center; padding:1rem 0}
.brand{display:flex; gap:.55rem; align-items:center; font:800 1.3rem var(--display); color:var(--ink); text-decoration:none}
.brand img{height:46px; width:auto; display:block}
.brand{align-items:flex-end; line-height:1}
.top nav a{font-weight:700; color:var(--ink); text-decoration:none; margin-left:1.25rem}

.btn{border:0; border-radius:999px; background:var(--green); color:#fff; font-weight:700; padding:.8rem 1.3rem; text-decoration:none; display:inline-block; text-align:center}
.btn:hover{background:var(--green-dk)}
.btn.soft{background:#fff; color:var(--ink); border:1.5px solid var(--line)}
.btn.soft:hover{border-color:var(--green); color:var(--green-dk)}

/* ---- Search hero ---- */
.hero{background:transparent; padding:2rem 0 3.25rem; position:relative; overflow:hidden}
.hero .sunball{display:none; position:absolute; width:340px; height:340px; border-radius:50%; background:var(--sun); opacity:.35; right:-90px; top:-120px}
.hero h1{font-size:clamp(2.3rem,5.6vw,3.9rem); font-weight:500; line-height:1.04; max-width:16ch; position:relative}
.hero p.sub{font-size:1.15rem; color:var(--ink-soft); margin:.8rem 0 1.6rem; max-width:34rem; position:relative}
.finder{background:#fff; border-radius:24px; box-shadow:var(--shadow); padding:1rem; position:relative}
.toggle{display:flex; gap:.4rem; margin-bottom:.8rem; flex-wrap:wrap}
.toggle button{border:1.5px solid var(--line); background:#fff; color:var(--ink); font-weight:700; padding:.5rem 1rem; border-radius:999px}
.toggle button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff}
.fields{display:grid; grid-template-columns:1.3fr 1fr auto; gap:.6rem}
.fields label{display:block; font-size:.8rem; font-weight:700; color:var(--ink-soft); margin:0 0 .2rem .9rem}
.fields input{width:100%; font:inherit; font-size:1.05rem; color:var(--ink); background:var(--sky); border:2px solid transparent; border-radius:16px; padding:.85rem 1rem}
.fields input:focus{outline:none; border-color:var(--green); background:#fff}
.fields .btn{align-self:end; padding:.95rem 1.6rem; font-size:1.05rem}
.chips{display:flex; flex-wrap:wrap; gap:.45rem; margin-top:1rem; position:relative}
.chips button{border:0; background:rgba(255,255,255,.8); color:var(--ink); border-radius:999px; padding:.4rem .85rem; font-weight:700; font-size:.92rem}
.chips button:hover{background:#fff}

/* ---- Results ---- */
.res-head{max-width:920px; display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; margin:2rem 0 1rem}
.res-head h2{font-size:1.75rem}
.res-head label{display:flex; gap:.45rem; align-items:center; color:var(--ink-soft); font-weight:700}
.res-head input{accent-color:var(--green); width:1.15rem; height:1.15rem}
.cards{list-style:none; padding:0; margin:0 0 4rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1.5rem}
.card{background:#fff; border-radius:24px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; border:1px solid var(--line)}
.card .scene{aspect-ratio:16/8; display:block}
.card .scene svg{width:100%; height:100%; display:block}
.card .body{padding:0 1.25rem 1.25rem; display:flex; flex-direction:column; flex:1}
.card .logo{margin-top:-30px}
.logo{width:60px; height:60px; border-radius:18px; display:grid; place-items:center; color:#fff; font:800 1.2rem var(--display); border:4px solid #fff; box-shadow:0 4px 12px rgba(21,48,63,.12); flex:none}
.card h3{font-size:1.3rem; margin-top:.6rem}
.card .where{color:var(--ink-soft); margin:.15rem 0 .8rem}
.team{display:flex; align-items:center; gap:.7rem; margin-bottom:.9rem}
.faces{display:flex}
.faces .face{width:44px; height:44px; border-radius:50%; border:3px solid #fff; margin-left:-10px; overflow:hidden; background:var(--sky)}
.faces .face:first-child{margin-left:0}
.team small{color:var(--ink-soft); font-size:.9rem; line-height:1.3}
.avail{display:inline-flex; align-items:center; gap:.45rem; background:#E6F6F0; color:var(--green-dk); font-weight:700; border-radius:999px; padding:.35rem .8rem; font-size:.9rem; align-self:flex-start}
.avail.off{background:var(--blush); color:#8A3B22}
.dot{width:8px; height:8px; border-radius:50%; background:currentColor}
.card .acts{display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-top:auto; padding-top:1.1rem}
.card .acts .btn{display:flex; align-items:center; justify-content:center; white-space:nowrap; padding:.75rem .6rem}
.empty{padding:2rem; background:var(--warm); border-radius:20px; list-style:none}


/* ---- Practitioner cards ----
   Bridge's own take: an inset photo with the practice's tile pinned to it
   (person and practice belong together), gold notes for role and focus,
   and a sunrise strip at the foot for the next time and booking. */
.results{background:transparent; padding:.5rem 0 1rem}
.results .res-head{max-width:none}
.plist{list-style:none; padding:0; margin:0 0 4rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1.5rem; align-items:stretch}
.pcard{display:flex; flex-direction:column; background:#fff; border:1px solid #ECE5DA; border-radius:24px; box-shadow:0 12px 30px -18px rgba(21,48,63,.25); overflow:hidden}
.frame{position:relative; margin:.75rem .75rem 0}
.pcard .photo{display:block; aspect-ratio:1/1; border-radius:18px; overflow:hidden; background:#EFEAE2}
.pcard .photo img{object-position:50% 22%}
.pcard .photo svg{width:100%; height:100%; display:block}
.flag{position:absolute; top:.7rem; right:.7rem; background:rgba(255,255,255,.92); color:#9A4A26; font:700 .7rem/1 var(--body); letter-spacing:.14em; text-transform:uppercase; padding:.5rem .7rem; border-radius:999px; box-shadow:0 2px 8px rgba(21,48,63,.12)}
.plogo{position:absolute; left:1rem; bottom:-22px; width:52px; height:52px; border-radius:15px; display:grid; place-items:center; color:#fff; font:800 1rem var(--display); border:4px solid #fff; box-shadow:0 4px 12px rgba(21,48,63,.15); text-decoration:none}
.pcard .info{padding:1.9rem 1.25rem 1rem; display:flex; flex-direction:column; gap:.4rem; flex:1}
.kicker{font:700 .76rem/1.45 var(--body); letter-spacing:.16em; text-transform:uppercase; color:#B8862B}
.pname{font:600 1.55rem/1.1 var(--serif); letter-spacing:-.005em; margin:0; color:var(--ink)}
.at{color:var(--ink-soft); font-size:.94rem; display:flex; flex-wrap:wrap; gap:.15rem .7rem; align-items:center}
.at a{font-weight:700; color:var(--ink); text-decoration:none; border-bottom:2px solid var(--sun)}
.pin{display:inline-flex; gap:.3rem; align-items:center}
.pin svg{width:14px; height:14px; flex:none; color:#B8862B}
.bio{margin:.25rem 0 0; font-size:.98rem; color:var(--ink-soft); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.bio.open{-webkit-line-clamp:unset; display:block}
.more{align-self:flex-start; border:0; background:none; padding:0; font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:.74rem; color:#B8862B}
.more span{display:inline-block; transition:transform .2s}
.more[aria-expanded="true"] span{transform:rotate(180deg)}
.focus{display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.35rem}
.focus span{background:#F4EFE7; color:var(--ink); border-radius:999px; padding:.3rem .7rem; font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.foot{background:linear-gradient(100deg,#FFF4DF 0%,#FDEFE6 45%,#E7F4EF 100%); padding:.95rem 1.25rem 1.1rem; display:flex; flex-direction:column; gap:.75rem}
.next{display:flex; align-items:center; gap:.5rem; font-weight:700; font-size:.92rem; color:var(--ink)}
.next .dot{width:10px; height:10px; background:#F2A33A; box-shadow:0 0 0 4px rgba(242,163,58,.22)}
.next.off{color:#8A3B22} .next.off .dot{background:#C9714F; box-shadow:none}
.acts2{display:flex; align-items:center; gap:.9rem; flex-wrap:wrap}
.acts2 .btn{display:inline-flex; align-items:center; gap:.45rem; padding:.7rem 1.15rem}
.acts2 .link{font-weight:700; color:var(--ink); text-decoration:none}
.acts2 .link:hover{color:var(--green-dk)}
.icons{display:flex; gap:.25rem; margin-left:auto}
.icons a{width:36px; height:36px; display:grid; place-items:center; color:var(--ink); border-radius:50%; background:rgba(255,255,255,.7)}
.icons a:hover{background:#fff}
.icons svg{width:17px; height:17px}
@media (max-width:420px){ .icons{margin-left:0; width:100%; justify-content:flex-start} }

/* ---- Practice page ---- */
.p-hero{position:relative}
.p-hero .scene{height:clamp(200px,32vw,340px)}
.p-hero .scene svg{width:100%; height:100%; display:block}
.p-head{display:flex; gap:1.2rem; align-items:flex-start; margin-top:-56px; position:relative}
.p-head .logo{width:110px; height:110px; border-radius:28px; font-size:2rem; border-width:6px}
.p-head .t{padding-top:66px; min-width:0}
.p-head h1{font-size:clamp(2rem,4.6vw,3rem); font-weight:500}
.pills{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.5rem}
.pill{background:var(--sky); border-radius:999px; padding:.25rem .75rem; font-size:.88rem; font-weight:700; color:var(--ink)}
.pill.ok{background:#E6F6F0; color:var(--green-dk)}
.pill.warm{background:var(--warm)}
.layout{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:2.5rem; margin:2.2rem 0 4rem; align-items:start}
.welcome{background:var(--warm); border-radius:24px; padding:1.6rem}
.welcome h2{font-size:1.7rem; margin-bottom:.6rem}
.welcome p{font-size:1.08rem; margin:0 0 .8rem}
.services{display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.4rem}
.services span{background:#fff; border-radius:999px; padding:.3rem .8rem; font-size:.9rem; font-weight:700}
.blk{margin-top:2.5rem}
.blk > h2{font-size:1.9rem; margin-bottom:1rem}
.teamgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1.1rem}
.person{background:#fff; border:1px solid var(--line); border-radius:22px; overflow:hidden; box-shadow:var(--shadow)}
.person .portrait{aspect-ratio:1/1; background:var(--sky)}
.person .portrait svg{width:100%; height:100%; display:block}
.person .pb{padding:1rem 1.1rem 1.2rem}
.person h3{font-size:1.15rem}
.person .role{color:var(--ink-soft); font-size:.9rem; margin:.1rem 0 .55rem}
.person blockquote{margin:0; font-size:.98rem; border-left:3px solid var(--sun); padding-left:.7rem}
.locs{display:grid; gap:1rem}
.loc{background:var(--sky); border-radius:22px; padding:1.3rem}
.loc h3{font-size:1.2rem}
.loc .addr{margin:.2rem 0 .8rem}
.hours{display:grid; grid-template-columns:auto 1fr; gap:.15rem 1.2rem; font-size:.95rem; background:#fff; border-radius:14px; padding:.8rem 1rem}
.hours .today{font-weight:700; color:var(--green-dk)}
.contact{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.9rem}
.refer{background:#fff; border:1.5px dashed var(--line); border-radius:22px; padding:1.3rem}
.refer h2{font-size:1.25rem; margin-bottom:.4rem}

/* booking panel */
.book{background:#fff; border-radius:26px; box-shadow:0 18px 45px rgba(21,48,63,.12); border:1px solid var(--line); padding:1.4rem; position:sticky; top:calc(env(safe-area-inset-top,0px) + 1rem)}
.book h2{font-size:1.45rem}
.live{display:flex; gap:.45rem; align-items:center; font-size:.88rem; color:var(--green-dk); font-weight:700; margin:.35rem 0 1rem}
.live .dot{background:#2DB37F; box-shadow:0 0 0 4px rgba(45,179,127,.2)}
.book label{display:block; font-weight:700; font-size:.9rem; margin:.8rem 0 .35rem}
.who{display:flex; gap:.5rem; flex-wrap:wrap}
.who button{display:flex; align-items:center; gap:.5rem; border:2px solid var(--line); background:#fff; border-radius:999px; padding:.25rem .8rem .25rem .25rem; font-weight:700; color:var(--ink)}
.who button .face{width:34px; height:34px; border-radius:50%; overflow:hidden}
.who button[aria-pressed="true"]{border-color:var(--green); background:#E6F6F0}
.book select{width:100%; font:inherit; color:var(--ink); background:var(--sky); border:2px solid transparent; border-radius:12px; padding:.65rem .8rem}
.days{display:flex; gap:.45rem; overflow-x:auto; padding:.15rem 0 .5rem}
.days button{flex:none; border:2px solid var(--line); background:#fff; color:var(--ink); border-radius:14px; padding:.45rem .65rem; min-width:64px; line-height:1.2; font-weight:700}
.days button small{display:block; font-weight:400; color:var(--ink-soft); font-size:.78rem}
.days button[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:#fff}
.days button[aria-pressed="true"] small{color:#fff}
.days button:disabled{opacity:.35; cursor:not-allowed}
.slots{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.4rem}
.slots button{border:0; background:#E6F6F0; color:var(--green-dk); font-weight:700; border-radius:12px; padding:.7rem 0}
.slots button:hover{background:var(--green); color:#fff}
.note{font-size:.9rem; background:var(--warm); border-radius:14px; padding:.75rem .9rem; margin-top:1rem}

/* dialog */
dialog{border:0; padding:0; border-radius:26px; width:min(560px,100% - 1.5rem); max-height:calc(100% - 2rem); background:#fff; color:var(--ink)}
dialog::backdrop{background:rgba(21,48,63,.45)}
.dlg{padding:1.5rem}
.dlg-head{display:flex; justify-content:space-between; gap:1rem; align-items:start}
.dlg-head h2{font-size:1.5rem}
.x{border:0; background:var(--sky); width:38px; height:38px; border-radius:50%; font-size:1.4rem; line-height:1; color:var(--ink); flex:none}
.chosen{display:flex; gap:.8rem; align-items:center; background:var(--sky); border-radius:18px; padding:.8rem 1rem; margin:1rem 0}
.chosen .face{width:52px; height:52px; border-radius:50%; overflow:hidden; flex:none}
.form .row{display:grid; grid-template-columns:1fr 1fr; gap:.8rem}
.form .f{margin-bottom:.85rem}
.form label{display:block; font-weight:700; font-size:.9rem; margin-bottom:.3rem}
.form .hint{font-weight:400; color:var(--ink-soft); font-size:.83rem}
.form input,.form select,.form textarea{width:100%; font:inherit; color:var(--ink); background:var(--sky); border:2px solid transparent; border-radius:12px; padding:.65rem .8rem}
.form input:focus,.form select:focus,.form textarea:focus{outline:none; border-color:var(--green); background:#fff}
.form textarea{min-height:4.5rem; resize:vertical}
.form .chk{display:flex; gap:.6rem; align-items:flex-start; font-weight:400; font-size:.93rem; margin:.4rem 0 1rem}
.form .chk input{width:1.2rem; height:1.2rem; margin-top:.15rem; accent-color:var(--green); flex:none; padding:0}
.err{color:#B3402A; font-weight:700; min-height:1.4em; margin:.2rem 0 .6rem}
.done{text-align:center}
.done .big{width:72px; height:72px; border-radius:50%; background:#E6F6F0; display:grid; place-items:center; margin:0 auto 1rem}
.done .contact{justify-content:center}

@media (max-width:900px){ .layout{grid-template-columns:minmax(0,1fr)} .book{position:static} .layout > aside{order:-1} }
@media (max-width:640px){
  .fields{grid-template-columns:1fr} .fields .btn{width:100%}
  .top nav a{margin-left:.7rem; font-size:.9rem} .brand{font-size:1.15rem} .brand img{height:38px}
  .p-head .logo{width:84px; height:84px; border-radius:22px; font-size:1.5rem}
  .p-head{margin-top:-42px; flex-direction:column; gap:.6rem} .p-head .t{padding-top:0}
  .form .row{grid-template-columns:1fr; gap:0}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important; transition:none!important} }
</style>
</head>
<body>
<div class="demo-note">Demo with sample practices. Nothing you enter is sent or saved. <a href="../">About Bridge</a></div>
<header class="top"><div class="wrap">
  <a class="brand" href="#/" aria-label="Bridgeworld home">

  <nav><a href="#/?t=dentist">Dentists</a><a href="#/?t=specialist">Specialists</a></nav>
</div></header>
<main id="app" tabindex="-1"></main>
<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>
<div class="sr" aria-live="polite" id="live"></div>

<script>
/* ===== Sample data. In the real product each practice edits this from its Bridge account. ===== */
const WEEK=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const H = (a,b,c,d,e,f,g)=>({Mon:a,Tue:b,Wed:c,Thu:d,Fri:e,Sat:f,Sun:g});
const PRACTICES=[
 {id:"riverbend-oms", type:"specialist", name:"Riverbend Oral & Facial Surgery", initials:"RF", color:"#1E8C72", tint:"#DDF3EC",

             {name:"Chermside", address:"14 Gympie Road, Chermside QLD 4032", phone:"07 5550 1843", email:"northside@riverbend.example", hours:H("Closed","8:30 am to 4:30 pm","Closed","8:30 am to 4:30 pm","Closed","Closed","Closed")}],
  people:[{name:"Dr Amelia Hart", photo:"photos/amelia-hart.jpg", bio:"Hi, I'm Amelia. I love helping nervous patients feel at ease before surgery. Most people who see me are having wisdom teeth or implants, and I make sure you know exactly what will happen, step by step, before we begin.", focus:["Wisdom teeth", "Dental implants", "Sedation"], role:"Oral and maxillofacial surgeon", quals:"BDSc, MBBS, FRACDS (OMS)", love:"I love seeing nervous patients walk out relieved and smiling.", locs:[0,1], look:{skin:"#F1C7A5", hair:"#6B3E26", style:"long", top:"#1E8C72"}},
          {name:"Dr Kenji Morales", photo:"photos/kenji-morales.jpg", bio:"I'm Kenji. Corrective jaw surgery can change how someone eats, breathes and smiles, and walking alongside patients through that change is a privilege. I also look after facial injuries and fractures.", focus:["Jaw surgery", "Facial trauma"], role:"Oral and maxillofacial surgeon", quals:"BDS, MBBS, FRACDS (OMS)", love:"Jaw surgery changes how people eat, breathe and smile. That never gets old.", locs:[0], look:{skin:"#D9A47E", hair:"#1E1A18", style:"short", top:"#2E5E8C"}}]},
 {id:"saltwater-perio", type:"specialist", name:"Saltwater Periodontics", initials:"SP", color:"#2F7FD0", tint:"#DCEBFB",
  specialty:"Periodontics", referral:false, accepting:true,

function portrait(x, bg, tall){

/* ===== Availability (simulates the live feed from each practice's Bridge schedule) ===== */
function seeded(str){let h=2166136261; for(const c of str){h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return ()=>{h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%1000)/1000;};}
function nextDays(n){const out=[],d=new Date(); d.setHours(0,0,0,0); while(out.length<n){d.setDate(d.getDate()+1); out.push(new Date(d));} return out;}
const dayKey=d=>WEEK[(d.getDay()+6)%7];
function slotsFor(p,l,i,date){
  if(!p.accepting) return [];
  const hrs=p.locations[l].hours[dayKey(date)];
  if(!hrs||hrs==="Closed"||!p.people[i].locs.includes(l)) return [];
  const r=seeded(p.id+l+i+date.toDateString());
  return ["8:30 am","9:15 am","10:00 am","10:45 am","11:30 am","1:15 pm","2:00 pm","2:45 pm","3:30 pm"].filter(()=>r()>.6);
}
function firstAvailable(p){ for(const d of nextDays(14)) for(let l=0;l<p.locations.length;l++) for(let i=0;i<p.people.length;i++){const s=slotsFor(p,l,i,d); if(s.length) return {d,t:s[0]};} return null; }
const fmtDay=d=>{const t=new Date(); t.setDate(t.getDate()+1); t.setHours(0,0,0,0); return d.getTime()===t.getTime()?"Tomorrow":d.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function matches(p){
  if(st.tab!=="all"&&p.type!==st.tab) return false;
  const what=st.what.trim().toLowerCase(), where=st.where.trim().toLowerCase();
  const hay=[p.name,p.specialty,...p.services,...p.people.map(x=>x.name+" "+x.role)].join(" ").toLowerCase();
  const place=p.locations.map(l=>l.name+" "+l.address).join(" ").toLowerCase();
  if(what && !what.split(/\s+/).every(t=>hay.includes(t.replace(/s$/,"")))) return false;
  if(where && !where.split(/\s+/).every(t=>place.includes(t))) return false;
  if(st.open){const fa=firstAvailable(p), lim=new Date(); lim.setDate(lim.getDate()+7); if(!(fa&&fa.d<=lim)) return false;}
  return true;
}

function personFirst(p,i){
  for(const d of nextDays(14)) for(let l=0;l<p.locations.length;l++){const s=slotsFor(p,l,i,d); if(s.length) return {d,t:s[0]};}
  return null;
}
function draw(){
  const items=[];

  const what=st.what.trim().toLowerCase();
  // when searching for a person by name, show just that person
  const named=items.filter(o=>what && o.x.name.toLowerCase().includes(what.replace(/^dr\s*/,"")));
  const rows=named.length?named:items;
  document.getElementById("count").textContent=rows.length?`${rows.length} ${rows.length===1?"practitioner":"practitioners"} ready to welcome you`:"No practitioners found";

  if(!rows.length){ul.innerHTML=`<li class="empty"><h3>Nothing matches that search yet</h3><p>Try a nearby suburb, a treatment like "implants", or switch to Everyone.</p></li>`; return;}
  ul.innerHTML=rows.map(({p,x,i},n)=>{
    const fa=personFirst(p,i), loc=p.locations[x.locs[0]];
    const maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(loc.address);

        ${fa?`<div class="next"><span class="dot"></span>Next available: ${fmtDay(fa.d)}, ${fa.t}</div>`:`<div class="next off"><span class="dot"></span>Not taking new patients right now</div>`}

      </div></li>`;}).join("");

}

  if(!opts.some(o=>o.i===bk.person)) bk.person=opts[0].i;
  const w=document.getElementById("who");
  w.innerHTML=opts.map(o=>`<button type="button" data-i="${o.i}" aria-pressed="${o.i===bk.person}"><span class="face">${portrait(o.x,p.tint)}</span>${esc(o.x.name.replace(/^Dr /,"Dr "))}</button>`).join("");
  w.querySelectorAll("button").forEach(b=>b.onclick=()=>{bk.person=+b.dataset.i; bk.day=null; people(p);});
  days(p);
}
function days(p){
  const ds=nextDays(14), av=ds.map(d=>slotsFor(p,bk.loc,bk.person,d)), w=document.getElementById("days");
  if(bk.day===null) bk.day=av.findIndex(a=>a.length);
  w.innerHTML=ds.map((d,i)=>`<button type="button" data-i="${i}" ${av[i].length?"":"disabled"} aria-pressed="${i===bk.day}">${d.toLocaleDateString("en-AU",{weekday:"short"})}<small>${d.getDate()} ${d.toLocaleDateString("en-AU",{month:"short"})}</small></button>`).join("");
  w.querySelectorAll("button").forEach(b=>b.onclick=()=>{bk.day=+b.dataset.i; days(p);});
  const s=document.getElementById("slots");
  if(bk.day<0){s.innerHTML=`<p style="grid-column:1/-1;color:var(--ink-soft)">No times in the next two weeks. Try someone else on the team.</p>`; return;}
  s.innerHTML=av[bk.day].map(t=>`<button type="button" data-t="${t}">${t}</button>`).join("");
  s.querySelectorAll("button").forEach(b=>b.onclick=()=>booking(p,ds[bk.day],b.dataset.t));
}

/* ===== Booking ===== */
const dlg=document.getElementById("dlg");
function openDlg(h){document.getElementById("dlg-body").innerHTML=h; dlg.showModal();}
function booking(p,date,time){
  const loc=p.locations[bk.loc], x=p.people[bk.person];
  const when=`${date.toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long"})} at ${time}`;
  openDlg(`<div class="dlg-head"><h2 id="dlg-title">Almost there</h2><button class="x" type="button" aria-label="Close" onclick="dlg.close()">&times;</button></div>
    <div class="chosen"><span class="face">${portrait(x,p.tint)}</span><div><strong>${esc(when)}</strong><br>${esc(x.name)}, ${esc(p.name)} (${esc(loc.name)})</div></div>
    <form class="form" id="bf" novalidate>
      <div class="row"><div class="f"><label for="fn">First name</label><input id="fn" autocomplete="given-name"></div><div class="f"><label for="ln">Last name</label><input id="ln" autocomplete="family-name"></div></div>
      <div class="row"><div class="f"><label for="dob">Date of birth</label><input id="dob" type="date"></div><div class="f"><label for="mob">Mobile</label><input id="mob" type="tel" autocomplete="tel"></div></div>
      <div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
      <div class="f"><label for="why">What's the visit for?</label><select id="why"><option>${p.type==="specialist"?"Consultation":"Check-up and clean"}</option>${p.services.map(s=>`<option>${esc(s)}</option>`).join("")}<option>Something else</option></select></div>
      ${p.referral?`<div class="f"><label for="ref">Referral letter <span class="hint">Optional now. You can also bring it on the day.</span></label><input id="ref" type="file" accept=".pdf,image/*"></div>`:""}
      <div class="f"><label for="notes">Anything we should know? <span class="hint">Optional, e.g. if you feel nervous</span></label><textarea id="notes"></textarea></div>
      <label class="chk"><input type="checkbox" id="ok"> I agree to ${esc(p.name)} using these details to manage my appointment and care.</label>
      <p class="err" id="ferr" role="alert"></p>
      <button class="btn" type="submit" style="width:100%">Book appointment</button>
    </form>`);
  document.getElementById("bf").onsubmit=e=>{
    e.preventDefault(); const er=document.getElementById("ferr");
    const need=["fn","ln","dob","mob","em"].find(id=>!document.getElementById(id).value.trim());
    if(need){er.textContent="Fill in your name, date of birth, mobile and email to book."; document.getElementById(need).focus(); return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById("em").value.trim())){er.textContent="Enter a valid email address."; document.getElementById("em").focus(); return;}
    if(!document.getElementById("ok").checked){er.textContent="Tick the box to agree before booking."; document.getElementById("ok").focus(); return;}
    const first=document.getElementById("fn").value.trim();
    openDlg(`<div class="done"><div class="big" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#1E8C72" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 id="dlg-title">Appointment booked</h2>
      <p style="margin:.6rem 0">See you soon, ${esc(first)}! You're booked with ${esc(x.name)} on ${esc(when)} at ${esc(loc.address)}.</p>
      <p style="color:var(--ink-soft);font-size:.95rem">In the real product, this lands in the practice's Bridge schedule straight away and you'd get a confirmation by email and SMS. This demo didn't send or save anything.</p>
      <div class="contact"><a class="btn soft" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc.address)}" target="_blank" rel="noopener">Directions</a><button class="btn" type="button" onclick="dlg.close()">Done</button></div></div>`);
    live.textContent="Appointment booked";
  };
}

/* ===== Router ===== */
function route(){
  const m=location.hash.match(/^#\/p\/([^/?]+)(\/book)?(?:\/(\d+))?/);
  const p=m&&PRACTICES.find(x=>x.id===m[1]);
  if(p){document.title=`${p.name} | Bridgeworld demo`; renderPractice(p,!!m[2], m[3]!==undefined?+m[3]:null);}
  else {document.title="Bridgeworld directory demo | Find a dentist or specialist near you"; renderSearch();}
  if(!(m&&m[2])) window.scrollTo(0,0);
  app.focus({preventScroll:true});
}
addEventListener("hashchange",route); route();
</script>
